<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Кав'ярня - Оформлення замовлення</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f5f2;
            color: #4a3f35;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            display: flex;
            gap: 30px;
            max-width: 1000px;
            width: 100%;
        }
        h1, h2 { color: #6f4e37; }
        .menu, .cart-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .menu { flex: 2; }
        .cart-section { flex: 1; height: fit-content; }
        .product-card {
            border: 1px solid #e0d8d0;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .product-info h3 { margin: 0 0 5px 0; }
        .product-price { font-weight: bold; color: #2ecc71; }
        button {
            background-color: #6f4e37;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #5a3d2b; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #cart-items { list-style: none; padding: 0; }
        #cart-items li {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #eee;
            padding: 10px 0;
        }
        .cart-total { font-size: 1.2em; font-weight: bold; margin: 15px 0; border-top: 2px solid #eee; padding-top: 10px;}
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .order-btn { width: 100%; font-size: 1.1em; background-color: #27ae60; }
        .order-btn:hover { background-color: #219653; }
    </style>
</head>
<body>

<div class="container">
    <div class="menu">
        <h1>Меню кав'ярні</h1>
        <div id="products-list">
            <p>Завантаження меню...</p>
        </div>
    </div>

    <div class="cart-section">
        <h2>Ваш кошик</h2>
        <ul id="cart-items">
            <li>Кошик порожній</li>
        </ul>
        <div class="cart-total">
            Разом: <span id="total-price">0</span> грн
        </div>
        
        <div>
            <label for="customerName">Ваше ім'я:</label>
            <input type="text" id="customerName" placeholder="Введіть ім'я для замовлення" required>
            <button id="submitBtn" class="order-btn" onclick="submitOrder()">Замовити</button>
        </div>
    </div>
</div>

<script>
    const API_BASE_URL = 'https://localhost:7253/api'; 
    let cart = [];

    async function loadProducts() {
        const productsList = document.getElementById('products-list');
        try {
            const response = await fetch(`${API_BASE_URL}/products`);
            if (!response.ok) throw new Error('Помилка сервера');
            
            const products = await response.json();
            productsList.innerHTML = '';

            if (products.length === 0) {
                productsList.innerHTML = '<p>Меню наразі порожнє.</p>';
                return;
            }

            products.forEach(product => {
                const productEl = document.createElement('div');
                productEl.className = 'product-card';
                productEl.innerHTML = `
                    <div class="product-info">
                        <h3>${product.name}</h3>
                        <div class="product-price">${product.price} грн</div>
                    </div>
                    <button onclick="addToCart(${product.id}, '${product.name}', ${product.price})">Додати в кошик</button>
                `;
                productsList.appendChild(productEl);
            });
        } catch (error) {
            console.error('Помилка завантаження товарів:', error);
            productsList.innerHTML = `
                <p style="color: red;">Не вдалося підключитися до сервера (${API_BASE_URL}). Перевірте, чи запущено проєкт у Visual Studio.</p>
                <button onclick="addMockProducts()">Показати тестове меню (без сервера)</button>
            `;
        }
    }

    function addToCart(id, name, price) {
        const existingItem = cart.find(item => item.productId === id);
        if (existingItem) {
            existingItem.quantity += 1;
        } else {
            cart.push({ productId: id, name: name, price: price, quantity: 1 });
        }
        updateCartUI();
    }

    function updateCartUI() {
        const cartItemsEl = document.getElementById('cart-items');
        const totalPriceEl = document.getElementById('total-price');
        
        cartItemsEl.innerHTML = '';
        let total = 0;

        if (cart.length === 0) {
            cartItemsEl.innerHTML = '<li>Кошик порожній</li>';
            totalPriceEl.innerText = '0';
            return;
        }

        cart.forEach(item => {
            total += item.price * item.quantity;
            const li = document.createElement('li');
            li.innerHTML = `
                <span>${item.name} (x${item.quantity})</span>
                <span>${item.price * item.quantity} грн</span>
            `;
            cartItemsEl.appendChild(li);
        });

        totalPriceEl.innerText = total;
    }

    async function submitOrder() {
        const customerNameInput = document.getElementById('customerName').value.trim();
        const submitBtn = document.getElementById('submitBtn');

        if (!customerNameInput) {
            alert('Будь ласка, введіть ваше ім\'я!');
            return;
        }
        if (cart.length === 0) {
            alert('Ваш кошик порожній. Додайте товари перед замовленням.');
            return;
        }

        const orderPayload = {
            customerName: customerNameInput,
            items: cart.map(item => ({
                productId: item.productId,
                quantity: item.quantity
            }))
        };

        try {
            submitBtn.disabled = true;
            submitBtn.innerText = 'Відправка...';

            const response = await fetch(`${API_BASE_URL}/orders`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(orderPayload)
            });

            if (response.ok) {
                const responseData = await response.json();
                alert(`Успіх! Замовлення #${responseData.id || responseData.orderId} оформлено.`);
                
                cart = [];
                document.getElementById('customerName').value = '';
                updateCartUI();
            } else {
                const errorData = await response.json();
                console.error('Помилка валідації сервера:', errorData);
                alert('Помилка при створенні замовлення. Перевірте дані.');
            }
        } catch (error) {
            console.error('Помилка відправки:', error);
            alert('Помилка з\'єднання з сервером.');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Замовити';
        }
    }

    function addMockProducts() {
        const mockProducts = [
            { id: 1, name: "Еспресо", price: 40 },
            { id: 2, name: "Капучино", price: 65 },
            { id: 3, name: "Круасан", price: 50 }
        ];
        const productsList = document.getElementById('products-list');
        productsList.innerHTML = '';
        mockProducts.forEach(product => {
            productsList.innerHTML += `
                <div class="product-card">
                    <div class="product-info">
                        <h3>${product.name}</h3>
                        <div class="product-price">${product.price} грн</div>
                    </div>
                    <button onclick="addToCart(${product.id}, '${product.name}', ${product.price})">Додати в кошик</button>
                </div>
            `;
        });
    }

    window.onload = loadProducts;
</script>

</body>
</html>
